name: Backup Supabase (stopgap manual)

# PED-22: a org do Supabase está no plano free, sem PITR/backup diário
# automatizado. Este workflow é um stopgap manual (pg_dump agendado) até
# o upgrade de plano acontecer — não substitui backup real com PITR.
# Ver docs/superpowers/plans/2026-08-26-ped20-23-banco-rls-auditoria.md

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 America/Sao_Paulo (UTC-3), diariamente
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, production]
    steps:
      - name: Install postgresql-client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          DB_URL: ${{ matrix.environment == 'staging' && secrets.STAGING_DB_URL || secrets.PRODUCTION_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::Secret ${{ matrix.environment == 'staging' && 'STAGING_DB_URL' || 'PRODUCTION_DB_URL' }} não configurado. Veja o runbook em docs/ para como obter a connection string no Supabase Dashboard (Settings > Database > Connection string, modo 'Session pooler' ou direto)."
            exit 1
          fi
          mkdir -p backup
          pg_dump "$DB_URL" \
            --no-owner --no-privileges --format=custom \
            --file="backup/${{ matrix.environment }}-$(date -u +%Y%m%dT%H%M%SZ).dump"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ matrix.environment }}-${{ github.run_id }}
          path: backup/*.dump
          retention-days: 30
