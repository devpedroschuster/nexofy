name: CI

on:
  pull_request:

jobs:
  lint-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webapp
    env:
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      VITE_ROOT_DOMAINS: e2e.test
      E2E_ADMIN_A_EMAIL: ${{ secrets.E2E_ADMIN_A_EMAIL }}
      E2E_ADMIN_A_PASSWORD: ${{ secrets.E2E_ADMIN_A_PASSWORD }}
      E2E_ADMIN_B_EMAIL: ${{ secrets.E2E_ADMIN_B_EMAIL }}
      E2E_ADMIN_B_PASSWORD: ${{ secrets.E2E_ADMIN_B_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Add tenant hostnames to /etc/hosts
        run: |
          echo "127.0.0.1 iluminus.e2e.test" | sudo tee -a /etc/hosts
          echo "127.0.0.1 ronaldo.e2e.test" | sudo tee -a /etc/hosts

      - name: Run E2E tests
        run: npm run e2e

      # SEGURANÇA: NÃO subir webapp/test-results/ aqui — contém os traces
      # brutos do Playwright (trace.zip), que gravam headers de requisição
      # e valores de page.fill() literalmente, incluindo secrets como
      # E2E_ASAAS_WEBHOOK_TOKEN e as senhas de E2E_ADMIN_*_PASSWORD. Este
      # repositório é público, então qualquer artifact de Actions é
      # baixável por qualquer pessoa com acesso de leitura — um run que
      # falhou já publicou um desses valores antes disso ser corrigido
      # (ver PED-28). webapp/playwright-report/ (relatório HTML, sem o
      # trace.zip embutido) é seguro e é só o que sobe.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: webapp/playwright-report/
          retention-days: 7
