name: CI

on:
  pull_request:

jobs:
  # PED-142: .gitguardian.yaml já existia na raiz do repo sem nenhum step
  # que o executasse. `secrets` não é um contexto válido em nenhum `if:`
  # (nem de job, nem de step — só em jobs.<job_id>.env e similares), por
  # isso o secret é espelhado num env de job primeiro; o `if:` do step
  # então lê `env`, que É válido em steps.if. Sem o secret
  # GITGUARDIAN_API_KEY configurado (crie uma conta grátis em
  # dashboard.gitguardian.com e adicione o secret no repo), o step aparece
  # como "skipped" em vez de falhar toda PR por falta de credencial.
  secret-scan:
    name: GitGuardian Secret Scan
    runs-on: ubuntu-latest
    env:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitGuardian scan
        if: ${{ env.GITGUARDIAN_API_KEY != '' }}
        uses: GitGuardian/ggshield-action@v1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  lint-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  db-diff:
    name: Supabase DB Diff (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # PED-167: PRs do Dependabot rodam sem acesso a secrets do
      # repositório (proteção do GitHub Actions contra exfiltração via
      # dependência maliciosa) — STAGING_DB_URL chega vazio e o script
      # falhava "hard" com "variável não definida" em toda PR do bot,
      # sem relação nenhuma com a dependência sendo atualizada. Sem a
      # secret não há como checar drift; pula em vez de reportar falha.
      - name: Check schema drift against staging
        if: ${{ env.STAGING_DB_URL != '' }}
        run: ./scripts/check-db-diff.sh

  deno-check:
    name: Deno Check (Supabase Functions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # PED-77: valida supabase/functions/ no CI — antes só era checado
      # manualmente (foi assim que o erro de type-check da PED-66 passou
      # despercebido). PED-76/77 zeraram os erros pré-existentes que
      # bloqueavam este gate (lembretes-aula, e mais os achados durante o
      # trabalho da PED-77 em criar-acesso-aluno/criar-estudio/
      # gerenciar-acesso-professor/gerar-mensalidades).
      - name: Type-check edge functions
        run: deno check supabase/functions/*/index.ts

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webapp
    env:
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      VITE_ROOT_DOMAINS: e2e.test
      E2E_ADMIN_A_EMAIL: ${{ secrets.E2E_ADMIN_A_EMAIL }}
      E2E_ADMIN_A_PASSWORD: ${{ secrets.E2E_ADMIN_A_PASSWORD }}
      E2E_ADMIN_B_EMAIL: ${{ secrets.E2E_ADMIN_B_EMAIL }}
      E2E_ADMIN_B_PASSWORD: ${{ secrets.E2E_ADMIN_B_PASSWORD }}
      E2E_ASAAS_WEBHOOK_TOKEN: ${{ secrets.E2E_ASAAS_WEBHOOK_TOKEN }}
      # PED-50: service role key do projeto de staging — usada só pelo
      # beforeAll de webhook-pagamento.spec.js pra resetar o fixture
      # (webhook_events não tem policy pra anon/authenticated; só service
      # role escreve/lê essa tabela). NÃO reaproveitar a anon key aqui.
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      # PED-167: PRs do Dependabot rodam sem acesso a secrets do
      # repositório (proteção do GitHub Actions contra exfiltração via
      # dependência maliciosa) — VITE_SUPABASE_URL e as demais secrets
      # E2E_* chegam vazias, e os specs falhavam "hard" em
      # "Missing required env var" em toda PR do bot, sem relação
      # nenhuma com a dependência sendo atualizada. VITE_SUPABASE_URL é
      # usada como canário: sem ela, nenhuma secret de E2E está
      # disponível, então pula os steps que dependem delas.
      - name: Install Playwright browsers
        if: ${{ env.VITE_SUPABASE_URL != '' }}
        run: npx playwright install --with-deps chromium

      - name: Add tenant hostnames to /etc/hosts
        if: ${{ env.VITE_SUPABASE_URL != '' }}
        run: |
          echo "127.0.0.1 iluminus.e2e.test" | sudo tee -a /etc/hosts
          echo "127.0.0.1 ronaldo.e2e.test" | sudo tee -a /etc/hosts

      - name: Run E2E tests
        if: ${{ env.VITE_SUPABASE_URL != '' }}
        run: npm run e2e

      # SEGURANÇA: nenhum artifact de Playwright é publicado — nem
      # test-results/ (trace.zip bruto) nem playwright-report/ (relatório
      # HTML). O reporter HTML EMBUTE o trace.zip inteiro dentro de
      # playwright-report/data/*.zip pra deixar o relatório navegável sem
      # depender de test-results/ — confirmado empiricamente (um teste
      # com header/fill fake gerou um .zip embutido contendo o valor em
      # texto puro). Também embute os .md de error-context, que trazem o
      # snapshot de acessibilidade da página — incluindo o texto literal
      # digitado em campos de senha (visto de verdade num trace real
      # nesta sessão). Ou seja: qualquer um dos dois formatos de artifact
      # vaza os mesmos segredos (E2E_ASAAS_WEBHOOK_TOKEN,
      # E2E_ADMIN_*_PASSWORD) num repositório público, onde artifacts de
      # Actions são baixáveis por qualquer pessoa com acesso de leitura.
      # Depuração de falha usa `gh run view <id> --log-failed` (texto
      # puro do stdout do Playwright, sem DOM/headers) — suficiente na
      # prática pra todo diagnóstico feito até aqui nesta sessão.
