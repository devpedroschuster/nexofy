# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "Nexofy_Admin"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = true

[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

[storage.vector]
enabled = false
max_buckets = 10
max_indexes = 5

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = ""

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.mfa]
max_enrolled_factors = 10

# PED-175 (achado de auditoria LGPD): contas de dono/admin de estúdio
# administram dado sensível de saúde e dado financeiro de terceiros
# (alunos) — MFA ausente era um risco desproporcional ao que está em jogo.
# TOTP habilitado (app autenticador, sem custo por SMS); enrollment é
# opcional/incentivado por ora (link "Segurança" no menu admin, ver
# webapp/src/components/Sidebar.jsx), não bloqueante — ver
# webapp/src/pages/SegurancaConta.jsx pro fluxo de enrollment e
# webapp/src/pages/Login.jsx pro desafio aal2 no login de quem já tiver um
# fator verificado.
#
# ⚠️ Este arquivo só afeta o stack local (`supabase start`)/CLI. Staging e
# produção são projetos hospedados — o mesmo toggle precisa ser replicado
# manualmente em Authentication → Providers → Multi-Factor Authentication
# no dashboard de cada projeto (não há hoje uma tool de MCP nem um passo de
# CI que sincronize auth config de config.toml pros projetos hospedados).
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

[auth.web3.solana]
enabled = false

[auth.third_party.firebase]
enabled = false

[auth.third_party.auth0]
enabled = false

[auth.third_party.aws_cognito]
enabled = false

[auth.third_party.clerk]
enabled = false

[auth.oauth_server]
enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = true
port = 54327
backend = "postgres"

[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"

[functions.lembretes-aula]
enabled = true
verify_jwt = true
import_map = "./functions/lembretes-aula/deno.json"
entrypoint = "./functions/lembretes-aula/index.ts"

[functions.criar-subconta-asaas]
enabled = true
# Sempre exige JWT — diferente de gerar-mensalidades, esta function não tem
# invocação por cron, então não há motivo para permitir chamadas sem sessão.
verify_jwt = true
import_map = "./functions/criar-subconta-asaas/deno.json"
entrypoint = "./functions/criar-subconta-asaas/index.ts"

[functions.assinar-plano-nexofy]
enabled = true
# Sempre exige JWT — ação sensível (move dinheiro real), sem invocação
# por cron, chamada só pelo admin autenticado do próprio estúdio.
verify_jwt = true
import_map = "./functions/assinar-plano-nexofy/deno.json"
entrypoint = "./functions/assinar-plano-nexofy/index.ts"

[functions.gerar-mensalidades]
enabled = true
# PED-57/PED-68: precisa ser false para o cron (autenticado via x-cron-secret, sem
# JWT — ver AUTORIZAÇÃO em index.ts) conseguir chamar esta function. Este bloco na
# RAIZ é o que efetivamente vale: confirmado via inspeção do deploy em produção que
# rodava com verify_jwt=true mesmo com supabase/functions/gerar-mensalidades/config.toml
# dizendo false, porque este arquivo (raiz) nunca teve um bloco
# [functions.gerar-mensalidades] antes deste fix — o config.toml por-function sozinho
# não é suficiente.
verify_jwt = false
import_map = "./functions/gerar-mensalidades/deno.json"
entrypoint = "./functions/gerar-mensalidades/index.ts"

[functions.expurgo-retencao-lgpd]
enabled = true
# PED-176: precisa ser false pro cron (autenticado via x-cron-secret, sem JWT — ver
# AUTORIZAÇÃO em index.ts) conseguir chamar esta function. Mesma lição do bloco
# [functions.gerar-mensalidades] acima: o config.toml por-function sozinho não basta,
# este bloco na RAIZ é o que efetivamente vale no deploy.
verify_jwt = false
import_map = "./functions/expurgo-retencao-lgpd/deno.json"
entrypoint = "./functions/expurgo-retencao-lgpd/index.ts"

[functions.exportar-dados-aluno]
enabled = true
# PED-172: sempre exige JWT — self-service do próprio titular ou pedido
# tratado por admin/super_admin autenticado, nunca chamada anônima/cron.
verify_jwt = true
entrypoint = "./functions/exportar-dados-aluno/index.ts"

[functions.health]
enabled = true
# PED-157: precisa ser false para o monitor de uptime externo (UptimeRobot /
# Better Uptime) conseguir chamar esta function — esses serviços não enviam
# JWT do Supabase. Mesma lição do bloco [functions.gerar-mensalidades] acima:
# o config.toml por-function sozinho não é suficiente, este bloco na RAIZ é
# o que efetivamente vale no deploy.
verify_jwt = false
entrypoint = "./functions/health/index.ts"

[functions.webhook-assinatura-nexofy]
enabled = true
# Asaas não envia JWT do Supabase — autenticação é via header
# asaas-access-token (ver comentário de segurança no index.ts).
verify_jwt = false
import_map = "./functions/webhook-assinatura-nexofy/deno.json"
entrypoint = "./functions/webhook-assinatura-nexofy/index.ts"