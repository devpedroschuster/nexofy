[functions.gerar-mensalidades]
verify_jwt = false  # Permite chamada do cron sem auth (autorização real é o check de
                    # x-cron-secret dentro da própria function — ver AUTORIZAÇÃO em
                    # index.ts). PED-57/PED-68: o config.toml da RAIZ (supabase/config.toml)
                    # é o arquivo que a CLI/deploy realmente lê — confirmado que este
                    # arquivo por-function sozinho NÃO bastava (produção rodava com
                    # verify_jwt=true até o bloco [functions.gerar-mensalidades] ser
                    # adicionado na raiz). Ver esse bloco lá para o histórico completo.

# PED-68: iteração por estúdio resolvida — handleRequest() em index.ts trata "é
# chamada de cron E não veio estudioId no payload" como o sinal pra rodar o modo
# batch (handleBatchTodosEstudios): itera todo estúdio com status='ativo' e gera a
# mensalidade de cada um, isoladamente (falha em um não aborta os demais). Por isso
# o command abaixo continua sem body — a ausência de estudioId é intencional aqui,
# não um bug. Uma chamada manual (sem x-cron-secret) sem estudioId continua
# rejeitada com 400: só o cron pode disparar o modo "todos os estúdios".
[[cron]]
name = "cobrancas-mensais"
schedule = "0 8 1 * *"   # Dia 1 de cada mês, às 08h — 9 dias antes do vencimento (dia 10)
command = "POST https://tciiepqmnrrcjnqhspvw.supabase.co/functions/v1/gerar-mensalidades -H 'x-cron-secret: ${CRON_SECRET}' -H 'Content-Type: application/json'"
